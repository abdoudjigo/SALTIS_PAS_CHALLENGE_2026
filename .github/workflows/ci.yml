name: CI

on:
  push:
    branches: [main, develop, "dev/**"]
  pull_request:
    branches: [main, develop]
  # Lancement à la main (onglet Actions), par exemple pour relancer dbt sur une branche
  workflow_dispatch:

# Si on repousse sur la même branche, on annule l'ancien run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # 1. Lint : attrape les erreurs de syntaxe et les vrais bugs (pas le style)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - name: Ruff (erreurs de syntaxe et bugs seulement)
        run: ruff check . --select E9,F63,F7,F82,F401

  # 2. Tests Python (requirements.txt à la racine, aucun secret requis)
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Installer les dépendances
        run: pip install -r requirements.txt pytest
      - name: Vérifier que le code se compile
        run: python -m compileall -q api ingestion
      - name: Lancer pytest
        # code 5 = aucun test trouvé : on ne casse pas le CI pour ça
        run: pytest -q || [ $? -eq 5 ]

  # 3. dbt : compile le projet, puis build + tests sur Snowflake, dans les schémas CI_* seulement
  #    (cible « ci » : dbt/profiles.yml et dbt/macros/generate_schema_name.sql ; constat d'audit DATA-01).
  #    Lancé sur les PR, sur main et develop, ou à la main ; pas à chaque push sur dev/** (crédits Snowflake).
  dbt:
    runs-on: ubuntu-latest
    # pas de secrets pour les PR venant de forks
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    defaults:
      run:
        working-directory: dbt
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: CI
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install dbt-snowflake
      - name: Installer les packages dbt (si présents)
        run: '[ -f packages.yml ] && dbt deps || echo "pas de packages.yml"'
      - name: Compiler le projet (cible ci)
        run: dbt parse --target ci
      - name: Garde-fou - aucun modèle ne doit viser un schéma de production
        run: |
          python - <<'PY'
          import json, sys
          noeuds = json.load(open("target/manifest.json"))["nodes"].values()
          fautifs = sorted({n["schema"] for n in noeuds
                            if n["resource_type"] in ("model", "seed", "snapshot") and not n["schema"].upper().startswith("CI_")})
          if fautifs:
              sys.exit(f"Schémas hors CI_* avec la cible ci : {fautifs}. Voir dbt/macros/generate_schema_name.sql")
          print("OK : tous les modèles et seeds visent un schéma CI_*")
          PY
      - name: Build (run + test) sur Snowflake, schémas CI_*
        run: dbt build --target ci

  # 4. Front (app/) : lint, tests (Vitest) et build avec les données d'exemple (aucun secret)
  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_USE_MOCK: "true"

  # 5. Verdict unique, pratique pour protéger develop et main
  ci-status:
    runs-on: ubuntu-latest
    needs: [lint, tests, dbt, front]
    if: always()
    steps:
      - name: Vérifier le résultat des jobs
        run: |
          echo "lint=${{ needs.lint.result }} tests=${{ needs.tests.result }} dbt=${{ needs.dbt.result }} front=${{ needs.front.result }}"
          # dbt peut être « skipped » (push sur dev/**, PR venant d'un fork) : ce n'est pas un échec
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.tests.result }}" != "success" ] || [ "${{ needs.front.result }}" != "success" ]; then
            exit 1
          fi
          if [ "${{ needs.dbt.result }}" != "success" ] && [ "${{ needs.dbt.result }}" != "skipped" ]; then
            exit 1
          fi