saltis:
  target: snowflake
  outputs:
    # Cible de travail et de production : écrit dans SALTIS.STAGING, SALTIS.INTERMEDIATE et SALTIS.MARTS
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
      threads: 4

    # Cible du CI (dbt build --target ci) : tout est écrit dans des schémas préfixés CI_
    # (CI_STAGING, CI_INTERMEDIATE, CI_MARTS ; macros/generate_schema_name.sql), jamais dans ceux de la production.
    # Les sources (SALTIS.RAW) sont seulement lues. Rôle dédié facultatif : SNOWFLAKE_CI_ROLE.
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_CI_ROLE', env_var('SNOWFLAKE_ROLE')) }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: CI
      threads: 4
