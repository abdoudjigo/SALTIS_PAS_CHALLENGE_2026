name: saltis
version: "1.0"
profile: saltis
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

models:
  saltis:
    staging:      {+materialized: view,  +schema: staging}
    intermediate: {+materialized: view,  +schema: intermediate}
    marts:        {+materialized: table, +schema: marts}

seeds:
  saltis:
    +schema: staging

vars:
  # Passer à true une fois SALTIS.RAW.GEO_DEPARTEMENTS chargée (GADM 4.1) :
  # active stg_geo_departements, latitude/longitude dans dim_geographie
  # et le test geo_departements_correspondance.
  geo_departements_charge: false
