version: 2
sources:
  - name: raw
    database: SALTIS
    schema: raw
    tables:
      # ---- Carte des opportunités : sources « eau », une ligne par département.
      # Créées par snowflake/30_eau_raw.sql, chargées par ingestion/collecte/eau/charger_snowflake.py.
      # Utilisées seulement si la variable eau_chargee vaut true.
      - name: e_eau_souterraine_departement
        description: Nappes souterraines (BGS, grille 5 km) ramenées au département.
      - name: e_irrigation_departement
        description: Irrigation équipée vers 2005 (FAO GMIA v5) ramenée au département.
      - name: e_eau_surface_departement
        description: >
          Eau présente au moins 10 mois sur 12 et terres cultivables à moins de 2 km,
          vertes ou nues en saison sèche (Earth Engine : JRC GSW, ESA WorldCover, MODIS).
      # ---- Cadre harmonisé (CILSS / IPC), créé par snowflake/40_cadre_harmonise_raw.sql,
      # chargé par ingestion/collecte/cadre_harmonise/. Grain : département source × cycle × type de période.
      - name: e_cadre_harmonise_departement
        description: >
          Cadre harmonisé par département GADM, cycles depuis 2014 (HDX, CC BY).
          Keur Massar (créé en 2021, hors GADM 4.1) porte le code de Pikine, en lignes séparées.
      - name: a_predicteurs_saisonniers
      - name: a_profil_agroclimatique_departement
      - name: a_repartition_pluie_departement_decade
      - name: a_repartition_pluie_zone_decade
      - name: a_saisons_departement
      - name: a_suivi_pluie_decade
      - name: b_adequation_culture_departement
      - name: b_adequation_variete_departement
      - name: b_referentiel_varietes
      - name: c_besoins_departement_culture
      - name: c_besoins_par_hectare
      - name: c_facteurs_limitants_zone_culture
      - name: c_rendements_departement
      - name: d_besoins_consolides_departement
      - name: d_stocks_disponibles
      - name: d_scenarios_repartition
      - name: app_intrants
      - name: geo_departements
        description: >
          Contours GADM 4.1 des départements (niveau 2), à charger avec
          snowflake/10_geo_departements.sql. Licence non commerciale,
          citation obligatoire. Utilisée seulement si la variable
          geo_departements_charge vaut true.
