version: 2

models:

  # ------------------------------------------------------------------
  # Dimensions
  # ------------------------------------------------------------------

  - name: dim_temps
    description: >
      Calendrier journalier 1980-2035 avec mois, décade (1 à 36), campagne
      agricole (juin N à mai N+1) et saison.
    columns:
      - name: id_temps
        data_tests: [not_null, unique]
      - name: date_complete
        data_tests: [not_null, unique]
      - name: decade_mois
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]
                quote: false
      - name: numero_decade_annee
        data_tests: [not_null]
      - name: campagne_agricole
        data_tests: [not_null]

  - name: dim_geographie
    description: >
      Référentiel des 45 départements avec leur région et leur zone
      agroécologique. Région et zone sont deux regroupements parallèles
      (Louga, Matam et Tambacounda couvrent deux zones) : pas de hiérarchie.
    columns:
      - name: id_departement
        data_tests: [not_null, unique]
      - name: code_departement
        data_tests: [not_null, unique]
      - name: departement
        data_tests: [not_null]
      - name: region
        data_tests: [not_null]
      - name: id_region
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_region')
                field: id_region
      - name: code_region
        description: Déduit du code département (règle GADM), à confirmer avec GID_1.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_region')
                field: code_region
      - name: id_zone_agroecologique
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zone_agroecologique')
                field: id_zone_agroecologique

  - name: dim_region
    description: >
      Référentiel des 14 régions administratives, dérivé du profil
      agroclimatique. Regroupement parallèle à la zone agroécologique,
      sans lien région -> zone.
    columns:
      - name: id_region
        data_tests: [not_null, unique]
      - name: code_region
        description: Déduit du code département (SEN.10.1_1 -> SEN.10_1, règle GADM), à confirmer avec GID_1.
        data_tests: [not_null, unique]
      - name: region
        data_tests: [not_null, unique]
      - name: nb_departements
        data_tests: [not_null]

  - name: dim_intrant
    description: >
      Référentiel des 9 intrants de référence (seed ref_intrants) : produits,
      éléments fertilisants et eau, avec unité et teneurs N-P2O5-K2O.
    columns:
      - name: id_intrant
        data_tests: [not_null, unique]
      - name: code_intrant
        data_tests: [not_null, unique]
      - name: type_intrant
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PRODUIT', 'ELEMENT', 'EAU']
      - name: unite
        data_tests: [not_null]

  - name: dim_zone_agroecologique
    description: Référentiel des 6 zones agroécologiques.
    columns:
      - name: id_zone_agroecologique
        data_tests: [not_null, unique]
      - name: zone_agroecologique
        data_tests: [not_null, unique]

  - name: dim_culture
    description: >
      Référentiel des cultures présentes dans les rendements, les besoins et
      les variétés.
    columns:
      - name: id_culture
        data_tests: [not_null, unique]
      - name: culture
        data_tests: [not_null, unique]

  - name: dim_variete
    description: >
      Référentiel des variétés documentées (incomplet, à compléter avec le
      catalogue DISEM / ISRA).
    columns:
      - name: id_variete
        data_tests: [not_null, unique]
      - name: variete
        data_tests: [not_null]
      - name: id_culture
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_culture')
                field: id_culture
