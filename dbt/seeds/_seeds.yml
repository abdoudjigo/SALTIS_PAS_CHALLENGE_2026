version: 2

seeds:
  - name: ref_intrants
    description: >
      Référentiel des 11 intrants de référence (produits, éléments fertilisants,
      eau) avec leur unité et leurs teneurs en N, P2O5 et K2O (%), dont
      NPK_15_10_10 et NPK_6_20_10 (formules PIA). Base de dim_intrant ;
      SALTIS.APP.intrants (C3) reprendra ces code_intrant.
    config:
      column_types:
        code_intrant: varchar
        nom_intrant: varchar
        type_intrant: varchar
        unite: varchar
        teneur_n_pct: float
        teneur_p2o5_pct: float
        teneur_k2o_pct: float
    columns:
      - name: code_intrant
        data_tests: [not_null, unique]

  - name: ref_departements
    description: >
      Coordonnées et zone secondaire des 45 départements, fournies par
      Ibrahima (data/referentiels/departements_zones_agroecologiques.csv).
      latitude et longitude : point représentatif du département (degrés
      décimaux, WGS 84). zone_secondaire : département de transition entre
      deux zones (8 départements), information seulement, jamais une clé
      d'agrégation. Codes, noms et zones identiques à dim_geographie (testé).
    config:
      column_types:
        code_departement: varchar
        departement: varchar
        zone_agroecologique: varchar
        zone_secondaire: varchar
        latitude: float
        longitude: float
    columns:
      - name: code_departement
        data_tests: [not_null, unique]
      - name: zone_agroecologique
        data_tests: [not_null]
      - name: latitude
        data_tests: [not_null]
      - name: longitude
        data_tests: [not_null]

  - name: ref_cultures
    description: >
      Paramètres agronomiques des 12 cultures, fournis par Ibrahima
      (data/referentiels/besoins_cultures.csv) : nom FAOSTAT, température de
      base (°C), durée de cycle (texte « min-max » en jours) et coefficients
      culturaux FAO-56 (Kc initial, mi-saison, fin de saison).
    config:
      column_types:
        culture: varchar
        nom_fao: varchar
        t_base_c: float
        cycle_jours: varchar
        kc_ini: float
        kc_mid: float
        kc_end: float
    columns:
      - name: culture
        data_tests: [not_null, unique]
      - name: cycle_jours
        data_tests: [not_null]

  - name: ref_doses_pia
    description: >
      Doses nationales des 6 cultures prioritaires (arachide, mil, niébé,
      sorgho, maïs, riz), catalogue IFDC-CORAF des Paquets d'Intrants
      Agricoles pour le Sénégal v1.1 (fiches variétales ISRA). Zone vide =
      portée nationale, statut A_CONFIRMER. dose retenue dans la fourchette
      dose_min-dose_max selon regle ; lignes ELEMENT = somme produit x teneur
      (ref_intrants). Riz : fiches du riz pluvial, appliquées hors Vallée.
      Clé (culture, zone, code_intrant) unique : tests/ref_doses_pia_valeurs_valides.sql.
    config:
      column_types:
        culture: varchar
        zone_agroecologique: varchar
        portee_geographique: varchar
        code_intrant: varchar
        type_intrant: varchar
        dose: float
        unite: varchar
        dose_min: float
        dose_max: float
        regle: varchar
        statut_validation: varchar
        source_reference: varchar
        note_source: varchar
    columns:
      - name: culture
        data_tests: [not_null]
      - name: portee_geographique
        data_tests:
          - accepted_values:
              arguments:
                values: ['NATIONAL', 'ZONE']
      - name: code_intrant
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('ref_intrants')
                field: code_intrant
      - name: dose
        data_tests: [not_null]
      - name: statut_validation
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['VALIDEE', 'A_CONFIRMER', 'NON_VERIFIEE']
      - name: source_reference
        data_tests: [not_null]

  - name: ref_prix_intrants
    description: >
      Prix des engrais, campagne 2026, une ligne par produit :
      prix_cession_sac_50kg_fcfa (prix payé par le producteur, subventionné),
      subvention_tonne_fcfa, cout_reel_sac_50kg_fcfa = cession + subvention / 20.
      Sources : APS (30 sept. 2025), circulaire du 30 avril 2026. Urée et DAP :
      A_SAISIR, valeurs vides (prix non trouvés). Clé (code_intrant, campagne)
      unique et coût réel : tests/ref_prix_intrants_valeurs_valides.sql.
    config:
      column_types:
        code_intrant: varchar
        campagne: integer
        prix_cession_sac_50kg_fcfa: float
        subvention_tonne_fcfa: float
        cout_reel_sac_50kg_fcfa: float
        statut_validation: varchar
        source: varchar
    columns:
      - name: code_intrant
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('ref_intrants')
                field: code_intrant
      - name: campagne
        data_tests: [not_null]
      - name: statut_validation
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['VALIDEE', 'A_CONFIRMER', 'A_SAISIR']
      - name: source
        data_tests: [not_null]

  - name: ref_objectifs_souverainete
    description: >
      Objectifs et chiffres officiels de l'Observatoire Sénégal 2050, une ligne par valeur et par document
      (SSA 2025-2034, LPSAE 2025-2029) : couvertures céréales et riz, semences certifiées, irrigation, pertes,
      producteurs climato-intelligents, géoréférencement, évaluations ; productions officielles 2019 et 2023
      (indicateur production_officielle) ; rendements de référence du tableau 8 de la SSA (indicateur
      rendement_reference, « référence indiquée par la SSA, origine non précisée »). Seules les valeurs vérifiées
      page par page (docs/audit-observatoire.md) sont reprises. Une cellule vide = non disponible (jamais 0).
      Les contradictions entre documents restent côte à côte (mil et arachide 2023) ; une erreur probable du
      document est gardée telle quelle avec une note (maïs 2019 : 50 705 t, lire 530 705 t).
      cultures_concernees : liste séparée par « ; » des cultures de la base visées par un objectif de groupe.
      Clé : tests/ref_objectifs_souverainete_valeurs_valides.sql.
    config:
      column_types:
        indicateur: varchar
        perimetre: varchar
        culture: varchar
        cultures_concernees: varchar
        unite: varchar
        valeur_reference: float
        annee_reference: integer
        cible: float
        annee_cible: integer
        document: varchar
        page: varchar
        url: varchar
        note: varchar
    columns:
      - name: indicateur
        data_tests: [not_null]
      - name: perimetre
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['national']
      - name: document
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SSA 2025-2034', 'LPSAE 2025-2029']
      - name: page
        data_tests: [not_null]

  - name: ref_departements_attendus
    description: >
      Départements attendus par culture pour les totaux région et pays de l'Observatoire : ceux qui ont au moins une
      campagne avec production et superficie entre 1981 et 2021 dans fact_rendement_departement (7 cultures :
      arachide, manioc, maïs, mil, niébé, riz, sorgho). Guédiawaye et Pikine ne sont jamais observés : exclus des
      totaux. Un total est « complet » quand tous ces départements sont observés. Sésame : pas de total.
    config:
      column_types:
        culture: varchar
        code_departement: varchar
        departement: varchar
    columns:
      - name: culture
        data_tests: [not_null]
      - name: code_departement
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geographie')
                field: code_departement
