# Production sur le VPS : voir deploy/README.md.
#   docker compose -f docker-compose.prod.yml up -d --build
# Seuls les ports 80 et 443 (Caddy) sont ouverts ; l'API et Redis restent internes.
# Redis est sur un réseau privé, sans sortie vers internet, que seule l'API rejoint.

x-durcissement: &durcissement
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  web:
    <<: *durcissement
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:?VITE_MAPBOX_TOKEN manquant dans .env}
        # Ancien nom VITE_EMAIL_CONTACT encore accepté
        EMAIL_CONTACT: ${EMAIL_CONTACT:-${VITE_EMAIL_CONTACT:-}}
        # Mesure d'audience : identifiant du site dans Umami (créé dans son tableau de bord, voir deploy/README.md)
        VITE_UMAMI_ID: ${UMAMI_WEBSITE_ID:-}
        # Adresse publique du site, pour les aperçus de partage (Open Graph)
        VITE_URL_SITE: https://${DOMAINE:?DOMAINE manquant dans .env}
    environment:
      # Obligatoire : sans nom de domaine, pas de certificat, donc pas de HTTPS (deploy/README.md)
      DOMAINE: ${DOMAINE:?DOMAINE manquant dans .env - un nom de domaine est obligatoire, le site est servi en HTTPS seulement}
    ports: ["80:80", "443:443"]
    volumes: [caddy-donnees:/data, caddy-config:/config]
    networks: [public]
    depends_on: [api]
    # Caddy n'a besoin que d'écouter sur 80 et 443
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    pids_limit: 200
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    <<: *durcissement
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    env_file: .env
    environment:
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/0
      API_HOST: 0.0.0.0
      # Le site et l'API ont la même origine (Caddy) : aucun autre site n'a à appeler l'API depuis un navigateur.
      # Pour en autoriser un : CORS_ORIGINES='["https://exemple.org"]' dans .env.
      CORS_ORIGINES: ${CORS_ORIGINES:-[]}
      # Documentation interactive coupée en production (elle reste disponible en local : python -m api)
      API_DOCS: ${API_DOCS:-false}
      # Caddy est le seul à joindre l'API : son X-Forwarded-For donne l'adresse du visiteur (limitation de débit)
      FORWARDED_ALLOW_IPS: "*"
      # Obligatoire : sans jeton, impossible de relire les données après un dbt build (POST /systeme/cache/rafraichir).
      # Générer avec : openssl rand -hex 24 (audit, constat ARC-03)
      API_ADMIN_TOKEN: ${API_ADMIN_TOKEN:?API_ADMIN_TOKEN manquant dans .env - générer avec openssl rand -hex 24}
      # Voix wolof : produite par le service « voix » ci-dessous, plus par l'API (audit, constat ARC-02)
      VOIX_SERVICE_URL: http://voix:8090
    volumes:
      - voix-cache:/app/voix/cache
    networks: [public, prive, voix]
    depends_on:
      redis: { condition: service_healthy }
    cap_drop: [ALL]
    # Sans torch ni modèle de voix : les données en mémoire seulement
    mem_limit: 2g
    pids_limit: 512
    healthcheck:
      # 200 quand des données sont servies (environ 30 s après le démarrage), 503 avant
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/api/v1/systeme/sante', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 180s

  # Voix wolof (SpeechT5 sur le processeur), à part de l'API : une synthèse ne peut plus ralentir la carte et les fiches.
  # Un cœur au plus (le VPS en a 2), mémoire bornée, aucun port publié : seule l'API l'appelle (audit, constat ARC-02).
  voix:
    <<: *durcissement
    build:
      context: .
      dockerfile: deploy/Dockerfile.voix
    volumes:
      # Modèles téléchargés au premier démarrage (~1 Go), gardés entre deux mises à jour (même volume qu'avant)
      - api-donnees:/donnees
    # Réseau « voix » non interne : le premier démarrage télécharge les modèles depuis Hugging Face
    networks: [voix]
    cap_drop: [ALL]
    cpus: 1.0
    mem_limit: 3g
    pids_limit: 200
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8090/sante', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 120s

  redis:
    <<: *durcissement
    image: redis:7-alpine
    # REDIS_PASSWORD (facultatif, dans .env, lettres et chiffres) : mot de passe exigé par Redis.
    # Vide = sans mot de passe : Redis n'est joignable que par l'API, sur le réseau privé.
    command: >-
      redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes: [redis-donnees:/data]
    networks: [prive]
    mem_limit: 1g
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+--no-auth-warning -a ${REDIS_PASSWORD}} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Mesure d'audience (Umami, sans cookie). Le site n'en expose que le script et la route d'envoi, sous /stats
  # (deploy/Caddyfile). Le tableau de bord n'écoute que sur le VPS lui-même (127.0.0.1:3001) : y accéder par
  # un tunnel SSH (deploy/README.md, section 7).
  umami:
    <<: *durcissement
    image: ghcr.io/umami-software/umami:3.4.1
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?UMAMI_DB_PASSWORD manquant dans .env}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET manquant dans .env}
      DISABLE_TELEMETRY: "1"
    ports: ["127.0.0.1:3001:3000"]
    networks: [public, umami]
    depends_on:
      umami-db: { condition: service_healthy }
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 200
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/heartbeat').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  umami-db:
    <<: *durcissement
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?UMAMI_DB_PASSWORD manquant dans .env}
    volumes: [umami-db:/var/lib/postgresql/data]
    networks: [umami]
    mem_limit: 256m
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  public:
  prive:
    internal: true
  # API ↔ voix seulement (Caddy n'y est pas) ; non interne pour le téléchargement des modèles
  voix:
  # Base d'Umami : joignable par Umami seulement, sans sortie internet
  umami:
    internal: true

volumes:
  caddy-donnees:
  caddy-config:
  api-donnees:   # modèles de la voix wolof (monté dans le service « voix »)
  voix-cache:
  redis-donnees:
  umami-db:
